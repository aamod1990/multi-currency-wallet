# Local stack:            docker compose up --build        -> http://localhost:8000 (app + MongoDB)
# With monitoring:        docker compose --profile monitoring up --build
#                         Prometheus http://localhost:9090, Grafana http://localhost:3000 (admin/admin)
services:
  mongo:
    image: ${MONGO_IMAGE:-public.ecr.aws/docker/library/mongo:7}
    # Transactions need a replica set; a single node is enough. The healthcheck
    # initiates it on first boot and then reports readiness.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodata:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    ports:
      - "${MONGO_PORT:-27017}:27017"

  app:
    build: .
    image: multi-currency-wallet:local
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URL: mongodb://mongo:27017/?replicaSet=rs0
      MONGODB_DB: wallet
      ENVIRONMENT: local
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789abcdef}
      FX_PROVIDER: ${FX_PROVIDER:-live}
      FX_REFRESH_INTERVAL_SECONDS: ${FX_REFRESH_INTERVAL_SECONDS:-3600}
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: INFO
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    ports:
      - "8000:8000"
    restart: unless-stopped

  prometheus:
    image: quay.io/prometheus/prometheus:v2.55.1
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    depends_on: [app]

  grafana:
    image: grafana/grafana:11.3.1
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus]

volumes:
  mongodata:
