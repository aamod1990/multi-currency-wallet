global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: wallet-api
    metrics_path: /metrics
    # For a deployed instance with METRICS_TOKEN set, add:
    # authorization: { type: Bearer, credentials_file: /etc/prometheus/metrics_token }
    static_configs:
      - targets: ["app:8000"]
