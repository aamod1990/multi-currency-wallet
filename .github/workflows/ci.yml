name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      TEST_MONGODB_URL: mongodb://localhost:27017/?directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      # Service containers can't take command args, so start a single-node replica set directly.
      - name: Start MongoDB replica set
        run: |
          # Docker Hub first (GitHub runners are not rate-limited there), ECR mirror as fallback.
          for img in mongo:7 public.ecr.aws/docker/library/mongo:7 mongo:7; do
            docker pull "$img" && MONGO_IMAGE="$img" && break
            sleep 5
          done
          docker run -d --name mongo -p 27017:27017 "$MONGO_IMAGE" --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }" && break
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval "while (!db.hello().isWritablePrimary) { sleep(500) }"
      - name: Lint
        run: ruff check backend tests && ruff format --check backend tests
      - name: Type check
        run: cd backend && mypy app
      - name: Unit + integration tests
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with: { name: backend-coverage, path: coverage.xml }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start stack (static FX so CI never depends on a third party)
        env:
          FX_PROVIDER: static
          MONGO_IMAGE: mongo:7
        run: docker compose up -d --build --wait
      - name: Smoke test
        run: ./infra/scripts/smoke_test.sh http://localhost:8000
      - name: Logs on failure
        if: failure()
        run: docker compose logs app
      - run: docker compose down -v
        if: always()

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then echo "RENDER_DEPLOY_HOOK_URL not configured; skipping"; exit 0; fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
      - name: Post-deploy verification
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          if [ -z "$PUBLIC_URL" ]; then echo "PUBLIC_URL not set; skipping"; exit 0; fi
          sleep 60
          for i in $(seq 1 40); do
            curl -fsS "$PUBLIC_URL/health/ready" && exit 0
            sleep 15
          done
          echo "Deployment did not become healthy"; exit 1
