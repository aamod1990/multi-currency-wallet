name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: wallet
          POSTGRES_PASSWORD: wallet
          POSTGRES_DB: wallet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wallet" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://wallet:wallet@localhost:5432/wallet_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - name: Lint
        run: ruff check backend tests && ruff format --check backend tests
      - name: Type check
        run: cd backend && mypy app
      - name: Unit + integration tests
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with: { name: backend-coverage, path: coverage.xml }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start stack (static FX so CI never depends on a third party)
        env:
          FX_PROVIDER: static
        run: docker compose up -d --build --wait
      - name: Smoke test
        run: ./infra/scripts/smoke_test.sh http://localhost:8000
      - name: Logs on failure
        if: failure()
        run: docker compose logs app
      - run: docker compose down -v
        if: always()

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then echo "RENDER_DEPLOY_HOOK_URL not configured; skipping"; exit 0; fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
      - name: Post-deploy verification
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          if [ -z "$PUBLIC_URL" ]; then echo "PUBLIC_URL not set; skipping"; exit 0; fi
          sleep 60
          for i in $(seq 1 40); do
            curl -fsS "$PUBLIC_URL/health/ready" && exit 0
            sleep 15
          done
          echo "Deployment did not become healthy"; exit 1
