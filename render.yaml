# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: multi-currency-wallet
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    autoDeploy: false   # CD is driven by GitHub Actions (deploy hook) after CI passes
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: wallet-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: FX_PROVIDER
        value: live
      - key: ALERT_WEBHOOK_URL
        sync: false

databases:
  - name: wallet-db
    plan: free
    databaseName: wallet
    user: wallet
