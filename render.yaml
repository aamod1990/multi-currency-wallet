# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: multi-currency-wallet
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    autoDeploy: false   # CD is driven by GitHub Actions (deploy hook) after CI passes
    envVars:
      # MongoDB Atlas (free M0 cluster is a replica set, so transactions work):
      # mongodb+srv://<user>:<password>@<cluster>.mongodb.net/?retryWrites=true&w=majority
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB
        value: wallet
      - key: JWT_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: FX_PROVIDER
        value: live
      - key: ALERT_WEBHOOK_URL
        sync: false

